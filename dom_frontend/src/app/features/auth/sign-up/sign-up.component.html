<app-auth-layout>
  <div class="w-full max-w-md p-8">
    <a href="#" class="text-sm text-indigo-600 hover:underline">< Back to dashboard</a>
    <h2 class="mt-4 text-3xl font-bold">Sign Up</h2>
    <p class="mt-2 text-gray-600">Enter your email & password to sign up.</p>

    <!-- Display success or error messages -->
    <div *ngIf="successMessage" class="mt-4 p-4 bg-green-100 text-green-700 rounded-lg">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="mt-4 p-4 bg-red-100 text-red-700 rounded-lg">
      {{ errorMessage }}
    </div>

    <form class="mt-6 space-y-4" (ngSubmit)="onSubmit()">
      <div class="flex space-x-4">
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700">First Name *</label>
          <input type="text" placeholder="Enter your first name" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" [(ngModel)]="firstName" name="firstName" required>
        </div>
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-700">Last Name *</label>
          <input type="text" placeholder="Enter your last name" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" [(ngModel)]="lastName" name="lastName" required>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Email *</label>
        <input type="email" placeholder="Enter your email" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" [(ngModel)]="email" name="email" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">FeId *</label>
        <input type="text" placeholder="Enter your feId" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" [(ngModel)]="feId" name="feId" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Phone *</label>
        <input type="text" placeholder="Enter your phone" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" [(ngModel)]="phone" name="phone" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Address *</label>
        <input type="text" placeholder="Enter your address" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" [(ngModel)]="address" name="address" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Gender *</label>
        <div class="flex space-x-4">
          <label class="inline-flex items-center">
            <input type="radio" [(ngModel)]="gender" [value]="1" name="gender" class="form-radio text-indigo-600" required>
            <span class="ml-2">Male</span>
          </label>
          <label class="inline-flex items-center">
            <input type="radio" [(ngModel)]="gender" [value]="0" name="gender" class="form-radio text-indigo-600" required>
            <span class="ml-2">Female</span>
          </label>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Date of Birth *</label>
        <input type="date" [(ngModel)]="dob" name="dob" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Password *</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" placeholder="Enter your password" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" [(ngModel)]="password" name="password" required>
          <button type="button" (click)="showPassword = !showPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center">
            <svg class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </button>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Confirm Password *</label>
        <div class="relative">
          <input [type]="showPassword1 ? 'text' : 'password'" placeholder="Confirm your password" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" [(ngModel)]="password1" name="password1" required>
          <button type="button" (click)="showPassword1 = !showPassword1" class="absolute inset-y-0 right-0 pr-3 flex items-center">
            <svg class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="flex items-center">
        <input type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded" [(ngModel)]="agreeTerms" name="agreeTerms" required>
        <label class="ml-2 text-sm text-gray-600">
          By creating an account means you agree to the <a href="#" class="text-indigo-600 hover:underline">TERMS AND CONDITIONS</a>, and our <a href="#" class="text-indigo-600 hover:underline">PRIVACY POLICY</a>
        </label>
      </div>
      <button type="submit" class="w-full py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700" style="background-color: #F36F21">Sign up</button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Already have an account? <a routerLink="/sign-in" class="text-indigo-600 hover:underline">Sign in</a>
    </p>
  </div>
</app-auth-layout>
